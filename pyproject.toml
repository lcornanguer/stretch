[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stretch-causal"
version = "0.1.0"
description = "Causal discovery under source-time-varying causal delays"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  {name = "Lénaïg Cornanguer"},
  {name = "David Kaltenpoth"},
  {name = "Jilles Vreeken"},
]
keywords = ["causal discovery", "time series", "time-varying delays"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "networkx>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "scipy>=1.10",
  "torch>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stretch = "stretch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
